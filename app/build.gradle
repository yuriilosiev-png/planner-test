// app/build.gradle — настройки приложения Planner.
//
// ОТЛИЧИЯ ОТ for-options (Options Analyst):
//   - namespace = com.planner.app, applicationId = com.losev.planner (com.planner.app занят в Play)
//   - убран plugin 'com.google.gms.google-services' (Firebase не используем)
//   - убраны зависимости firebase-bom и firebase-messaging
//   - versionCode=2, versionName="1.1" (нативный бэкап: шаринг/сохранение/импорт)
//   - versionCode=8, versionName="1.7" (релиз в Google Play: i18n RU/EN, фикс модалки
//     настроек, кнопка закрытия, свои категории; specialUse subtype переведён на английский)
//   - versionCode=9, versionName="1.7.1" (target API 36 — требование Play, дедлайн
//     31.08.2026; фикс наезда заголовка на дату в шапке; опт-аут predictive back)
//   - versionCode=11, versionName="1.7.3" (тайминг задач в шторке при закрытом
//     приложении: фильтр по времени переехал в NotificationService, будильник
//     NotifAlarmReceiver + ACTION_TIME_TICK, сброс списка при смене даты)
//   - versionCode=12, versionName="1.7.4" (голосовой ввод в текстовых полях:
//     RecognizerIntent через AndroidBridge, <queries> в манифесте; мост
//     getAppVersionCode/openStore для плашки «Доступно обновление»)
//   - versionCode=13, versionName="1.7.4": та же 1.7.4, но код 12 уже занят в Play
//     ранней загрузкой ААБ (Play не даёт использовать код повторно, даже если
//     бандл убран из черновика). Плюс исправления хранилища.
//   - versionCode=14, versionName="1.7.5": новая иконка (адаптивная, слои в
//     res/mipmap-*), первый запуск — пример (demo/demo-<язык>.json) или шаблоны целей
//   - versionCode=15, versionName="1.7.6": уведомление со списком задач на системных
//     цветах текста — читается на любой шторке (MIUI не рисовал свой синий фон)
//   - versionCode=16, versionName="1.7.7": виджет «Сегодня» на главном экране и
//     кнопка «выполнено» в строках шторки (DoneReceiver, TodayWidget, TodayWidgetService).
// 1.8 зарезервирован под миграцию на OnBackInvokedCallback (см. комментарий
// enableOnBackInvokedCallback в AndroidManifest.xml) — поэтому здесь 1.7.x.
// Тулчейн (compileSdk 36, minSdk 24, target 36, AGP 8.9.1, Gradle 8.11.1) — как в
// рабочем билде Options Analyst, чтобы гарантированно собралось тем же CI.
apply plugin: 'com.android.application'

// Вариант сборки задаётся в gradle.properties (plannerVariant):
//   prod — боевое приложение: com.losev.planner, страница /planner/, имя «Planner»;
//   test — тестовая копия из репо planner-test: com.losev.planner.test,
//          страница /planner-test/, имя «Planner TEST». Ставится РЯДОМ с боевым,
//          данные у них раздельные.
// Код в обоих репо одинаковый, отличается только эта строка в gradle.properties.
def plannerTest = (project.findProperty('plannerVariant') ?: 'prod') == 'test'

android {
    namespace "com.planner.app"
    // BuildConfig.PAGES_PATH (в AGP 8 BuildConfig по умолчанию выключен)
    buildFeatures { buildConfig true }
    compileSdkVersion 36
    defaultConfig {
        // applicationId — идентификатор в Google Play, необратим после публикации.
        // com.planner.app оказался занят чужим приложением. namespace ниже остаётся
        // прежним (это Java-пакет, Play его не видит) — Java-файлы трогать не нужно.
        applicationId plannerTest ? "com.losev.planner.test" : "com.losev.planner"
        resValue "string", "app_name", plannerTest ? "Planner TEST" : "Planner"
        buildConfigField "String", "PAGES_PATH", plannerTest ? '"/planner-test/"' : '"/planner/"'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 16
        versionName "1.7.7"
    }
    signingConfigs {
        // Тестовая сборка подписывается своим ключом app/test.jks — он лежит только
        // в репо planner-test, пароли открытые. Секреты GitHub ей не нужны, а подпись
        // от сборки к сборке одна и та же — APK ставится поверх без удаления.
        // В Google Play этот ключ никогда не идёт.
        test {
            storeFile file("test.jks")
            storePassword "plannertest"
            keyAlias "plannertest"
            keyPassword "plannertest"
        }
        release {
            // keystore и пароли приходят из env-переменных, которые задаёт workflow
            // из GitHub Secrets. Имя файла по умолчанию — planner.jks.
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "planner.jks")
            storePassword System.getenv("STORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig plannerTest ? signingConfigs.test : signingConfigs.release
        }
        debug { minifyEnabled false }
    }
    sourceSets {
        main { res.srcDirs = ['src/main/res'] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations {
    all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    // androidx.core нужен для ActivityCompat/ContextCompat (runtime-запрос
    // POST_NOTIFICATIONS на Android 13+). Firebase-зависимости НЕ подключаем.
    implementation 'androidx.core:core:1.10.1'
}
